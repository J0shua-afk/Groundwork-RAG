[project]
name = "groundwork"
version = "0.1.0"
description = "RAG assistant over co-op job postings that answers with citations or refuses."
requires-python = ">=3.13"
dependencies = [
    "anthropic==2.8.0",
    "fastapi==0.163.1",
    "httpx2==2.16.2",
    "psycopg[binary]==3.3.9",
    "python-dotenv==1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["groundwork"]

[tool.setuptools.package-data]
groundwork = ["prompts/*.md"]

[tool.vercel]
# vercel looks for main.py or app.py by default, ours is inside the package
entrypoint = "groundwork.api:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: hits the real database or Voyage API, run with -m integration"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
