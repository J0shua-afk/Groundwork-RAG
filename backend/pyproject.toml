[project]
name = "groundwork"
version = "0.1.0"
description = "RAG assistant over co-op job postings that answers with citations or refuses."
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["groundwork"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
